services:
  - type: web
    name: ai-techflow-studio
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL_RAW
        fromDatabase:
          name: techflow-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: techflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: techflow-db
          property: password
      - key: SERVER_PORT
        value: 10000
      - key: TECHFLOW_PROJECT_DIR
        value: /app
      - key: TECHFLOW_PYTHON_COMMAND
        value: python3
      - key: TECHFLOW_WORKER_SCRIPT
        value: inky_worker.py
      - key: OUTPUT_DIR
        value: /tmp/techflow-outputs
      - key: CHANNEL_NAME
        value: TechFlow VN
      - key: TTS_VOICE
        value: vi-VN-HoaiMyNeural
      - key: AI_PROVIDER
        value: gemini
      - key: AI_REQUIRED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: IMAGE_PROVIDER
        value: gemini
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_RESEARCH_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_SCRIPT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_IMAGE_QUALITY
        value: medium
      - key: ENABLE_AI_IMAGES
        value: "true"
      - key: MAX_AI_IMAGES
        value: "18"
      - key: MAX_SCENES
        value: "18"
      - key: RESEARCH_MAX_SOURCES
        value: "8"
      - key: VIDEO_AUDIO_MODE
        value: narrated
      - key: VIDEO_PROVIDER
        value: kenburns
      - key: VIDEO_ASPECT_RATIO
        value: "9:16"
      - key: VIDEO_RENDER_QUALITY
        value: draft
      - key: SEEDANCE2_IMAGE_TO_VIDEO_URL
        sync: false
      - key: SEEDANCE2_API_KEY
        sync: false
      - key: VEO_IMAGE_TO_VIDEO_URL
        sync: false
      - key: VEO_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        value: https://ai-techflow-studio.onrender.com/oauth/tiktok/callback
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        value: https://ai-techflow-studio.onrender.com/oauth/youtube/callback
      - key: TECHFLOW_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
        sync: false
      - key: TECHFLOW_ADMIN_EMAIL
        sync: false
      - key: TECHFLOW_ADMIN_PASSWORD
        sync: false
      - key: TECHFLOW_ADMIN_NAME
        value: TechFlow Admin
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: techflow-db
    plan: free
    region: singapore
    databaseName: techflow
    user: techflow
    postgresMajorVersion: "18"
