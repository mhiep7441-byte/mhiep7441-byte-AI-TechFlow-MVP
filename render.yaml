services:
  - type: web
    name: ai-techflow-studio
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL_RAW
        fromDatabase:
          name: techflow-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: techflow-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: techflow-db
          property: password
      - key: SERVER_PORT
        value: 10000
      - key: TECHFLOW_PROJECT_DIR
        value: /app
      - key: TECHFLOW_PYTHON_COMMAND
        value: python3
      - key: TECHFLOW_WORKER_SCRIPT
        value: video_worker.py
      - key: OUTPUT_DIR
        value: /tmp/techflow-outputs
      - key: CHANNEL_NAME
        value: TechFlow VN
      - key: TTS_VOICE
        value: vi-VN-HoaiMyNeural
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
        sync: false
      - key: TECHFLOW_ADMIN_EMAIL
        sync: false
      - key: TECHFLOW_ADMIN_PASSWORD
        sync: false
      - key: TECHFLOW_ADMIN_NAME
        value: TechFlow Admin
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: techflow-db
    plan: free
    region: singapore
    databaseName: techflow
    user: techflow
    postgresMajorVersion: "18"
