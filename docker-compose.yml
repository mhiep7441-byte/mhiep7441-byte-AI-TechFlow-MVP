services:
  postgres:
    image: postgres:17-alpine
    container_name: techflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techflow
      POSTGRES_USER: techflow
      POSTGRES_PASSWORD: techflow_dev
    ports:
      - "5432:5432"
    volumes:
      - techflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techflow -d techflow"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  techflow_postgres_data:
