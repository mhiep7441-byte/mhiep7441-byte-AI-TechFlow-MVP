spring.application.name=AI TechFlow Manager
server.port=${PORT:${SERVER_PORT:8080}}


spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/techflow}
spring.datasource.username=${DATABASE_USERNAME:techflow}
spring.datasource.password=${DATABASE_PASSWORD:techflow_dev}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=3
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
server.tomcat.max-threads=20
server.tomcat.min-spare-threads=2

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h
server.forward-headers-strategy=framework

techflow.bootstrap-admin.email=${TECHFLOW_ADMIN_EMAIL:}
techflow.bootstrap-admin.password=${TECHFLOW_ADMIN_PASSWORD:}
techflow.bootstrap-admin.name=${TECHFLOW_ADMIN_NAME:TechFlow Admin}

techflow.project-dir=${TECHFLOW_PROJECT_DIR:..}
techflow.python-command=${TECHFLOW_PYTHON_COMMAND:python}
techflow.worker-script=${TECHFLOW_WORKER_SCRIPT:inky_worker.py}
techflow.series-planner-script=${TECHFLOW_SERIES_PLANNER_SCRIPT:series_planner.py}
techflow.campaign-scheduler-delay-ms=${TECHFLOW_CAMPAIGN_SCHEDULER_DELAY_MS:60000}
techflow.tiktok.client-key=${TIKTOK_CLIENT_KEY:}
techflow.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
techflow.tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:http://localhost:8080/oauth/tiktok/callback}
techflow.token-encryption-key=${TECHFLOW_TOKEN_ENCRYPTION_KEY:}
techflow.youtube.client-id=${YOUTUBE_CLIENT_ID:}
techflow.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}
techflow.youtube.redirect-uri=${YOUTUBE_REDIRECT_URI:http://localhost:8080/oauth/youtube/callback}
