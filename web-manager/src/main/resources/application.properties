spring.application.name=AI TechFlow Manager
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/techflow}
spring.datasource.username=${DATABASE_USERNAME:techflow}
spring.datasource.password=${DATABASE_PASSWORD:techflow_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

techflow.project-dir=${TECHFLOW_PROJECT_DIR:..}
techflow.python-command=${TECHFLOW_PYTHON_COMMAND:python}
techflow.worker-script=${TECHFLOW_WORKER_SCRIPT:video_worker.py}
techflow.trend-feeds=${TREND_FEEDS:}
techflow.trend-allowed-domains=${TREND_ALLOWED_DOMAINS:developers.openai.com,docs.python.org,developers.tiktok.com}
