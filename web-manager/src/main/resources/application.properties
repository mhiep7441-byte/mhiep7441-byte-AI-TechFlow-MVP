spring.application.name=AI TechFlow Manager
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/techflow}
spring.datasource.username=${DATABASE_USERNAME:techflow}
spring.datasource.password=${DATABASE_PASSWORD:techflow_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger
springdoc.api-docs.path=/api-docs

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h
server.forward-headers-strategy=framework

techflow.bootstrap-admin.email=${TECHFLOW_ADMIN_EMAIL:}
techflow.bootstrap-admin.password=${TECHFLOW_ADMIN_PASSWORD:}
techflow.bootstrap-admin.name=${TECHFLOW_ADMIN_NAME:TechFlow Admin}

techflow.project-dir=${TECHFLOW_PROJECT_DIR:..}
techflow.python-command=${TECHFLOW_PYTHON_COMMAND:python}
techflow.worker-script=${TECHFLOW_WORKER_SCRIPT:video_worker.py}
techflow.tiktok.client-key=${TIKTOK_CLIENT_KEY:}
techflow.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
techflow.tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:http://localhost:8080/oauth/tiktok/callback}
techflow.token-encryption-key=${TECHFLOW_TOKEN_ENCRYPTION_KEY:}
